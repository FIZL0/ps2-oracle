[package]
name = "ps2-oracle"
description = "Run one of a PS2 game's own functions on chosen inputs, with no emulator: an R5900 interpreter for proving ports"
version = "0.1.4"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FIZL0/ps2-oracle"
publish = false

# One dependency, deliberately: the arithmetic model. This crate reads an ISO 9660 image and a PS2 ELF and
# interprets R5900 machine code — a few hundred lines of integer work, none of it worth a supply chain.
# Floats go through ps2-float so the oracle and the port under test agree by construction.
[dependencies]
ps2-float = { git = "https://github.com/FIZL0/ps2-float", tag = "v0.3.1" }

# An oracle run is tens of thousands of interpreted calls: minutes in a debug build, seconds here.
[profile.test]
opt-level = 2
